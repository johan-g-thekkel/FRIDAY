name: FRIDAY Flutter Windows desktop

on:
  push:
    branches: [main, fix/friday-central-console-merge-conflicts]
    paths:
      - "desktop_app/**"
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/flutter-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop_app/**"
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/flutter-windows.yml"

concurrency:
  group: friday-flutter-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_app
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Windows host files
        run: flutter create --platforms=windows --no-pub .

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart sources
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build Windows release
        run: flutter build windows --release

      - name: Assemble portable release package
        working-directory: ${{ github.workspace }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $stage = Join-Path $root "dist\\friday-windows"
          $release = Join-Path $root "desktop_app\\build\\windows\\x64\\runner\\Release"
          $releaseStage = Join-Path $stage "desktop_app\\build\\windows\\x64\\runner\\Release"

          if (-not (Test-Path $release)) {
            throw "Flutter release output was not found at $release"
          }

          New-Item -ItemType Directory -Path $releaseStage -Force | Out-Null
          Copy-Item -Path (Join-Path $release "*") -Destination $releaseStage -Recurse -Force
          Copy-Item -Path (Join-Path $root "backend") -Destination (Join-Path $stage "backend") -Recurse -Force
          Copy-Item -Path (Join-Path $root "scripts") -Destination (Join-Path $stage "scripts") -Recurse -Force
          Copy-Item -Path (Join-Path $root "requirements.txt") -Destination $stage -Force
          Copy-Item -Path (Join-Path $root "requirements-voice.txt") -Destination $stage -Force
          Copy-Item -Path (Join-Path $root ".env.example") -Destination $stage -Force
          Copy-Item -Path (Join-Path $root "README.md") -Destination $stage -Force

          $exampleProfiles = Join-Path $root "data\\model-profiles.example.json"
          if (Test-Path $exampleProfiles) {
            $stageData = Join-Path $stage "data"
            New-Item -ItemType Directory -Path $stageData -Force | Out-Null
            Copy-Item -Path $exampleProfiles -Destination $stageData -Force
          }

          Write-Host "Portable release package created at $stage"

      - name: Upload portable Windows release
        uses: actions/upload-artifact@v4
        with:
          name: friday-windows-portable
          path: dist/friday-windows/
          if-no-files-found: error
          retention-days: 14
