name: FRIDAY backend API tests

on:
  push:
    branches: [main, fix/friday-central-console-merge-conflicts]
  pull_request:
    branches: [main]

# Keep the latest branch state tested instead of queueing every rapid update.
concurrency:
  group: friday-api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend Python syntax
        run: python -m py_compile backend/*.py

      - name: Run tests
        run: pytest -q
